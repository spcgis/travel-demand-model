<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SPC OD Tool</title>
    <link rel="stylesheet" 
        href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <link rel="stylesheet" 
        href="./assets/styles.css">
    <script type="module" 
        src="https://js.arcgis.com/5.1/"></script>
    <script type="module" 
        src="./assets/app.js"></script>
</head>
<body>
    <div class = "container">
        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loading-content">
            <div class="spinner"></div>
            <h2>Loading application...</h2>
            <p id="loading-status">Initializing map</p>
            </div>
        </div>
        <!-- Upper block: Container of GUI -->
        <div class = "header-container">
            <button id="toggleHeader" class="toggle-arrow">▲</button>
            <!-- Left block: Header content -->
            <div class = "main-header">
                <h2 style="font-family:Helvetica; margin-bottom:0px;">SPC Model Validation | Current Focus: I-70 & I-79</h2>
                <p style="font-family:Helvetica; font-size:medium;">
                    <b>Unbuild</b> - DC25 loaded network, no change<br>
                    <b>Speed Change</b> - Increasing freeflow speed definitions for freeways<br>
                    <b>Speed Change (Difference)</b> - Difference in volume between Speed Change and Unbuild scenarios<br>
                </p>
            </div>
            <!-- Right block: Logos -->
            <div class = "logos">
                <img src="./assets/SPC_Wht.png" style="height: clamp(70px, 75px, 85px); width: auto;"/>
            </div>
        </div>
        <!-- Lower block: the Map -->
        <arcgis-map id="map" basemap="gray-vector" center="-80.240288,40.169712" zoom="12" popup-component-enabled="true">
            <!--The filter-->
            <div slot="top-right" id="filterContainer">
                <div style="margin-bottom: 10px;" id="networkSelect">
                    <label>Display Network:</label></br>
                    <label><input type="checkbox" id="CUBE">CUBE</label></br>
                    <div id="cubeSelect" style="display: none;">
                        <select>
                            <option value="UnBuild">Unbuild</option>
                            <option value="speedChange">Speed Change</option>
                            <option value="speedChange_diff">Speed Change (Difference)</option>
                        </select>
                    </div>
                    <label><input type="checkbox" id="PennDOT">PennDOT</label></br>
                    <label><input type="checkbox" id="Streetlight">Streetlight</label>
                </div>
                <div style="margin-bottom: 10px;">
                    <label for="zoneSelect">Zone Statistics:</label></br>
                    <select id="zoneSelect" style="border: 1px solid #ccc">
                        <option value="bound">TAZ Boundary</option>
                        <option value="none">None</option>
                        <option value="intrazonal">Intrazonal Trips</option>
                        <option value="areaType">Area Type</option>
                        <option value="popden">Population Density</option>
                        <option value="emden">Employment Density</option>
                    </select>
                </div>
            </div> 
            <!--Enable the popup-->
            <arcgis-popup slot="popup" default-popup-template-enabled="false"></arcgis-popup>
            <!--The legend-->
            <arcgis-expand slot="bottom-left" expanded>
                <arcgis-legend></arcgis-legend>
            </arcgis-expand>
        </arcgis-map>
    </div>
    <script>    
    // Configure the expansion arrow
    document.addEventListener("DOMContentLoaded", () => {
        const header = document.querySelector(".header-container");
        const btn = document.getElementById("toggleHeader");

        btn.addEventListener("click", () => {
            header.classList.toggle("header-collapsed");

            // Update arrow direction
            btn.textContent = header.classList.contains("header-collapsed") ? "▼" : "▲";
        });
    });
    </script>
</body>
</html>
